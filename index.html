<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08743b">
  <meta name="description" content="Application CSE Panzani">
  <link rel="manifest" href="manifest.json">
  <title>CSE Panzani</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f4;
      color: #18201c;
    }

    body {
      padding-bottom: 90px;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ================= HEADER ================= */

    .hero {
      position: relative;
      width: 100%;
      padding: 22px 18px 32px;
      background: linear-gradient(135deg, #006b35, #079449);
      color: white;
      border-radius: 0 0 42px 42px;
      box-shadow: 0 8px 24px rgba(0, 70, 35, .18);
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      left: -5%;
      right: -5%;
      bottom: -38px;
      height: 65px;
      background: #f3f5f4;
      border-radius: 50% 50% 0 0;
    }

    .brand {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 14px;
      padding-right: 45px;
    }

    .brand img {
      width: 92px;
      height: 92px;
      object-fit: contain;
      background: white;
      border-radius: 50%;
      padding: 5px;
      box-shadow: 0 4px 12px rgba(0,0,0,.18);
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand p {
      margin: 8px 0 0;
      font-size: 16px;
      line-height: 1.3;
    }

    .bell {
      position: absolute;
      z-index: 5;
      right: 17px;
      top: 25px;
      width: 45px;
      height: 45px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      color: white;
      font-size: 21px;
    }

    .bell span {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ed1b2f;
      color: white;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* ================= MAIN ================= */

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 17px 30px;
    }

    .welcome {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 15px;
      margin-bottom: 20px;
    }

    .welcome small {
      color: #6d7772;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: .08em;
    }

    .welcome h2 {
      margin: 6px 0 0;
      font-size: 30px;
      line-height: 1.12;
    }

    .date {
      color: #68736d;
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
    }

    /* ================= NEWS ================= */

    .news {
      display: flex;
      align-items: center;
      gap: 13px;
      background: white;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 17px;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
    }

    .news-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: #fff0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .news strong {
      display: block;
      font-size: 16px;
    }

    .news p {
      margin: 4px 0 0;
      color: #68736d;
      font-size: 12px;
      line-height: 1.3;
    }

    .news button,
    .feature button {
      margin-left: auto;
      width: 35px;
      height: 35px;
      border: 0;
      border-radius: 50%;
      background: #f1f3f2;
      font-size: 25px;
      color: #555;
      flex-shrink: 0;
    }

    /* ================= GRID ================= */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .card {
      min-height: 130px;
      border: 0;
      border-radius: 20px;
      padding: 15px;
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 5px 15px rgba(0,0,0,.07);
      overflow: hidden;
      transition: transform .12s ease;
    }

    .card:active {
      transform: scale(.97);
    }

    .card b {
      font-size: 27px;
      line-height: 1;
    }

    .card strong {
      font-size: 15px;
      line-height: 1.1;
    }

    .card span {
      font-size: 11px;
      line-height: 1.25;
      color: #5e6863;
    }

    .card.red {
      background: linear-gradient(135deg,#fff0f0,#ffe2e2);
    }

    .card.blue {
      background: linear-gradient(135deg,#edf5ff,#dcecff);
    }

    .card.green {
      background: linear-gradient(135deg,#edfff3,#d9f6e2);
    }

    .card.gold {
      background: linear-gradient(135deg,#fff8df,#fff0bd);
    }

    .card.purple {
      background: linear-gradient(135deg,#f5edff,#eadcff);
    }

    .card.pink {
      background: linear-gradient(135deg,#ffeaf5,#ffd7e9);
    }

    .card.teal {
      background: linear-gradient(135deg,#e8fbfb,#d4f3f3);
    }

    .card.dark {
      background: linear-gradient(135deg,#edf2f7,#dce4ed);
    }

    /* ================= FEATURE ================= */

    .feature {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-top: 17px;
      padding: 18px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
    }

    .feature > span {
      background: #fff5cf;
      color: #806500;
      border-radius: 10px;
      padding: 7px 9px;
      font-size: 10px;
      font-weight: bold;
      white-space: nowrap;
    }

    .feature strong {
      display: block;
      font-size: 14px;
    }

    .feature small {
      display: block;
      margin-top: 4px;
      color: #68736d;
      font-size: 11px;
    }

    /* ================= CONTENT ================= */

    .content {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
    }

    .content h2 {
      margin: 12px 0;
      font-size: 24px;
    }

    .content h3 {
      margin-top: 22px;
    }

    .content p {
      color: #5f6964;
      line-height: 1.5;
    }

    .back {
      border: 0;
      background: #eef3ef;
      color: #08743b;
      border-radius: 12px;
      padding: 10px 13px;
      font-weight: bold;
    }

    /* ================= FORMS ================= */

    form {
      display: grid;
      gap: 13px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5ddd8;
      border-radius: 11px;
      background: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #08743b;
    }

    .primary,
    .adminBtn {
      border: 0;
      border-radius: 12px;
      padding: 12px 15px;
      background: #08743b;
      color: white;
      font-weight: bold;
      margin-top: 5px;
    }

    .adminBtn {
      background: #edf5ef;
      color: #08743b;
    }

    .adminBtn.danger {
      background: #ffe7e7;
      color: #b51d2b;
    }

    .authBox {
      margin-top: 15px;
      padding: 16px;
      border-radius: 16px;
      background: #f4f8f5;
    }

    .authBox h3 {
      margin-top: 0;
    }

    .adminEvent {
      padding: 15px;
      margin: 10px 0;
      background: #f6f8f7;
      border-radius: 15px;
    }

    .adminEvent strong {
      display: block;
      font-size: 15px;
      margin-bottom: 7px;
    }

    .adminEvent small {
      display: block;
      color: #68736d;
      line-height: 1.5;
      margin-bottom: 9px;
    }

    .adminEvent button {
      border: 0;
      border-radius: 9px;
      padding: 9px 11px;
      margin: 3px 3px 0 0;
      background: #e8eee9;
      color: #08743b;
      font-weight: bold;
      font-size: 12px;
    }

    /* ================= BOTTOM ================= */

    .bottom {
      position: fixed;
      z-index: 9999;
      left: 0;
      right: 0;
      bottom: 0;
      height: 76px;
      display: grid;
      grid-template-columns: repeat(5,1fr);
      background: rgba(255,255,255,.98);
      border-top: 1px solid #ddd;
      box-shadow: 0 -5px 18px rgba(0,0,0,.09);
      padding: 4px 5px;
    }

    .bottom button {
      position: relative;
      border: 0;
      background: transparent;
      color: #68716d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 23px;
    }

    .bottom button small {
      font-size: 10px;
      font-weight: 600;
    }

    .bottom button.active {
      color: #08743b;
    }

    .bottom i {
      position: absolute;
      top: 3px;
      right: 18px;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #ed1b2f;
      color: white;
      font-size: 10px;
      font-style: normal;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 390px) {

      .brand img {
        width: 82px;
        height: 82px;
      }

      .brand h1 {
        font-size: 23px;
      }

      .brand p {
        font-size: 14px;
      }

      .welcome h2 {
        font-size: 26px;
      }

      .card {
        min-height: 125px;
        padding: 13px;
      }

      .card b {
        font-size: 24px;
      }

      .card strong {
        font-size: 13px;
      }

      .card span {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <header class="hero">
    <div class="brand">
      <img src="logo.png" alt="Logo CSE Panzani">

      <div>
        <h1>CSE PANZANI</h1>
        <p>Votre CSE, partout avec vous.</p>
      </div>
    </div>

    <button class="bell" aria-label="Notifications">
      🔔
      <span>3</span>
    </button>
  </header>

  <main>

    <section class="welcome">
      <div>
        <small>BIENVENUE</small>
        <h2>Les infos du CSE<br>à portée de main.</h2>
      </div>

      <div class="date" id="date"></div>
    </section>

    <section class="news">

      <div class="news-icon">📢</div>

      <div>
        <strong>Dernières actualités</strong>
        <p>
          Retrouvez les nouveaux affichages et informations du CSE.
        </p>
      </div>

      <button onclick="showSection('actualites')">›</button>

    </section>

    <div class="grid">

      <button class="card red"
              onclick="showSection('actualites')">
        <b>📰</b>
        <strong>ACTUALITÉS</strong>
        <span>Affichage · CSE · RH · CSSCT</span>
      </button>

      <button class="card blue"
              onclick="showSection('billetterie')">
        <b>🎟️</b>
        <strong>BILLETTERIE</strong>
        <span>Cinéma · Parcs · Spectacles</span>
      </button>

      <button class="card green"
              onclick="showSection('sorties')">
        <b>🚌</b>
        <strong>SORTIES & VOYAGES</strong>
        <span>Voyages · Ski · Journées</span>
      </button>

      <button class="card gold"
              onclick="showSection('offres')">
        <b>🎁</b>
        <strong>OFFRES CSE</strong>
        <span>Promotions · Avantages</span>
      </button>

      <button class="card purple"
              onclick="showSection('agenda')">
        <b>📅</b>
        <strong>AGENDA</strong>
        <span>Toutes les dates importantes</span>
      </button>

      <button class="card pink"
              onclick="showSection('inscriptions')">
        <b>📝</b>
        <strong>INSCRIPTIONS</strong>
        <span>Participez aux activités</span>
      </button>

      <button class="card teal"
              onclick="showSection('documents')">
        <b>📄</b>
        <strong>DOCUMENTS</strong>
        <span>Règlements · Infos · CR</span>
      </button>

      <button class="card dark"
              onclick="showSection('contact')">
        <b>☎️</b>
        <strong>CONTACT CSE</strong>
        <span>Une question ? Contactez-nous</span>
      </button>

    </div>

    <section class="feature">

      <span>⭐ À LA UNE</span>

      <div>
        <strong>
          Découvrez les prochaines activités du CSE
        </strong>

        <small>
          Sorties · Voyages · Billetterie · Événements
        </small>
      </div>

      <button onclick="showSection('sorties')">›</button>

    </section>

    <section
      id="content"
      class="content"
      hidden>
    </section>

  </main>

  <nav class="bottom">

    <button
      class="active"
      onclick="goHome()">
      ⌂
      <small>Accueil</small>
    </button>

    <button
      onclick="showSection('actualites')">
      ▤
      <small>Actualités</small>
    </button>

    <button
      onclick="showSection('agenda')">
      ▣
      <small>Agenda</small>
    </button>

    <button
      onclick="showSection('notifications')">
      ◌
      <small>Notifications</small>
      <i>3</i>
    </button>

    <button
      onclick="showSection('plus')">
      ☰
      <small>Plus</small>
    </button>

  </nav>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CONFIGURATION SUPABASE -->
  <script src="supabase-config.js"></script>

  <!-- APPLICATION -->
  <script src="app.js"></script>
  <script src="billetterie.js"></script>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
  </script>

</body>
</html>
