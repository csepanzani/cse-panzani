<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087b3e">
<title>CSE Panzani</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f5f4;
  color: #18201c;
}

body {
  padding-bottom: 100px;
}

/* =========================
   HEADER
========================= */

.header {
  position: relative;
  overflow: hidden;
  padding: 24px 18px 25px;
  background:
    radial-gradient(circle at 85% 85%, rgba(255,255,255,.12), transparent 28%),
    linear-gradient(135deg, #006b35, #079449);
  border-radius: 0 0 38px 38px;
  box-shadow: 0 8px 25px rgba(0,70,35,.18);
}

.header::after {
  content: "";
  position: absolute;
  left: -5%;
  right: -5%;
  bottom: -32px;
  height: 60px;
  background: #f3f5f4;
  border-radius: 50% 50% 0 0;
}

.header-content {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 15px;
}

.logo {
  width: 105px;
  height: 105px;
  flex-shrink: 0;
  object-fit: contain;
  background: white;
  padding: 5px;
  border-radius: 50%;
  box-shadow: 0 3px 12px rgba(0,0,0,.18);
}

.header-text {
  flex: 1;
  min-width: 0;
}

.header-text h1 {
  margin: 0;
  color: white;
  font-size: 28px;
  font-weight: 800;
  line-height: 1.05;
}

.header-text p {
  margin: 9px 0 0;
  color: white;
  font-size: 15px;
  line-height: 1.25;
}

.notification {
  position: absolute;
  z-index: 5;
  top: 18px;
  right: 15px;

  width: 48px;
  height: 48px;

  border: 0;
  border-radius: 50%;

  background: rgba(255,255,255,.17);
  color: white;

  font-size: 24px;
}

.notification span {
  position: absolute;
  top: -3px;
  right: -2px;

  min-width: 22px;
  height: 22px;

  padding: 2px 5px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #ef233c;
  color: white;

  border-radius: 50%;

  font-size: 12px;
  font-weight: bold;
}

/* =========================
   CONTENU
========================= */

.container {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 25px 18px;
}

.welcome {
  margin-bottom: 22px;
}

.welcome small {
  color: #626b66;
  font-size: 14px;
  letter-spacing: .4px;
}

.welcome h2 {
  margin: 14px 0 0;
  font-size: 34px;
  line-height: 1.08;
}

/* =========================
   ACTUALITÉS
========================= */

.latest {
  width: 100%;
  min-height: 125px;

  display: flex;
  align-items: center;

  padding: 18px;

  background: white;

  border: 1px solid #e0e5e2;
  border-radius: 22px;

  box-shadow: 0 5px 16px rgba(0,0,0,.08);

  margin-bottom: 18px;
}

.latest-icon {
  width: 58px;
  height: 58px;
  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #fff0f1;
  border-radius: 17px;

  font-size: 29px;
}

.latest-content {
  flex: 1;
  padding-left: 15px;
}

.latest-content strong {
  display: block;
  color: #d51c32;
  font-size: 17px;
}

.latest-content p {
  margin: 7px 0 0;
  color: #626b66;
  font-size: 14px;
  line-height: 1.4;
}

.arrow {
  flex-shrink: 0;
  color: #6d7771;
  font-size: 34px;
  font-weight: 300;
}

/* =========================
   GRILLE PRINCIPALE
========================= */

.cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

/* =========================
   CARTE
========================= */

.card {
  position: relative;
  overflow: hidden;

  min-height: 150px;

  display: flex;
  align-items: center;

  padding: 13px;

  border-radius: 22px;

  border: 1px solid rgba(0,0,0,.04);

  box-shadow: 0 5px 15px rgba(0,0,0,.07);

  text-align: left;

  cursor: pointer;
}

.card::after {
  content: "";
  position: absolute;
  width: 100px;
  height: 100px;
  right: -25px;
  bottom: -25px;

  border-radius: 50%;

  background: rgba(255,255,255,.20);
}

.card-icon {
  position: relative;
  z-index: 2;

  width: 68px;
  height: 68px;
  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 19px;

  color: white;

  font-size: 31px;

  box-shadow: 0 4px 10px rgba(0,0,0,.12);
}

.card-text {
  position: relative;
  z-index: 2;

  min-width: 0;
  flex: 1;

  padding-left: 12px;
}

.card-text strong {
  display: block;

  font-size: 16px;
  font-weight: 800;

  line-height: 1.08;
}

.card-text span {
  display: block;

  margin-top: 7px;

  color: #59635e;

  font-size: 12px;
  line-height: 1.3;
}

.card-arrow {
  position: relative;
  z-index: 3;

  width: 34px;
  height: 34px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: rgba(255,255,255,.65);

  font-size: 25px;
}

/* =========================
   COULEURS
========================= */

.card-red {
  background: #fff0f1;
}

.card-red .card-icon {
  background: #ed1d35;
}

.card-red .card-text strong {
  color: #c51c30;
}

.card-red .card-arrow {
  color: #c51c30;
}

.card-blue {
  background: #edf5ff;
}

.card-blue .card-icon {
  background: #1685e5;
}

.card-blue .card-text strong {
  color: #145c99;
}

.card-blue .card-arrow {
  color: #145c99;
}

.card-green {
  background: #edf9f1;
}

.card-green .card-icon {
  background: #079b4b;
}

.card-green .card-text strong {
  color: #08783b;
}

.card-green .card-arrow {
  color: #08783b;
}

.card-yellow {
  background: #fff8e5;
}

.card-yellow .card-icon {
  background: #efa900;
}

.card-yellow .card-text strong {
  color: #a36d00;
}

.card-yellow .card-arrow {
  color: #a36d00;
}

.card-purple {
  background: #f4edfc;
}

.card-purple .card-icon {
  background: #7a24c3;
}

.card-purple .card-text strong {
  color: #63209d;
}

.card-purple .card-arrow {
  color: #63209d;
}

.card-pink {
  background: #fff0f6;
}

.card-pink .card-icon {
  background: #e91e63;
}

.card-pink .card-text strong {
  color: #bd1850;
}

.card-pink .card-arrow {
  color: #bd1850;
}

.card-cyan {
  background: #eaf9fa;
}

.card-cyan .card-icon {
  background: #119ba4;
}

.card-cyan .card-text strong {
  color: #08777d;
}

.card-cyan .card-arrow {
  color: #08777d;
}

.card-dark {
  background: #edf1f5;
}

.card-dark .card-icon {
  background: #293c50;
}

.card-dark .card-text strong {
  color: #26384a;
}

.card-dark .card-arrow {
  color: #26384a;
}

/* =========================
   À LA UNE
========================= */

.featured {
  position: relative;
  overflow: hidden;

  margin-top: 18px;

  min-height: 155px;

  padding: 22px;

  display: flex;
  align-items: center;

  border-radius: 23px;

  background:
    linear-gradient(90deg, rgba(255,255,255,.98) 0%, rgba(255,255,255,.9) 52%, rgba(255,255,255,.35) 100%),
    linear-gradient(135deg,#a9d6ff,#2f9b64);

  box-shadow: 0 5px 18px rgba(0,0,0,.08);
}

.featured-text {
  position: relative;
  z-index: 2;
  flex: 1;
}

.featured-label {
  color: #d49a00;
  font-size: 14px;
  font-weight: 800;
}

.featured h3 {
  margin: 10px 0 7px;
  font-size: 23px;
  line-height: 1.1;
}

.featured p {
  margin: 0;
  color: #59635e;
  font-size: 13px;
}

.featured-arrow {
  position: relative;
  z-index: 2;

  width: 48px;
  height: 48px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #079449;
  color: white;

  border-radius: 50%;

  font-size: 31px;
}

<!-- =========================
     HEADER
========================= -->

<header class="header">

  <button class="notification" onclick="openPage('notifications')">
    ♧
    <span>3</span>
  </button>

  <div class="header-content">

    <img class="logo" src="logo.png" alt="CSE Panzani">

    <div class="header-text">
      <h1>CSE PANZANI</h1>
      <p>Votre CSE, partout avec vous.</p>
    </div>

  </div>

</header>


<!-- =========================
     APPLICATION
========================= -->

<main id="app">

  <div class="welcome">
    <small>BIENVENUE</small>

    <h2>
      Les infos du CSE<br>
      à portée de main.
    </h2>
  </div>


  <!-- DERNIÈRES ACTUALITÉS -->

  <button class="latest" onclick="openPage('actualites')">

    <div class="latest-icon">
      📣
    </div>

    <div class="latest-content">

      <strong>DERNIÈRES ACTUALITÉS</strong>

      <p>
        Retrouvez les nouveaux affichages

      </p>

    </div>

    <div class="arrow">›</div>

  </button>


  <!-- GRILLE -->

    <button class="card card-red"
            onclick="openPage('actualites')">

      <div class="card-icon">▤</div>

      <div class="card-text">
        <strong>ACTUALITÉS</strong>
        <span>Affichage · CSE<br>RH · CSSCT</span>
      </div>

      <div class="card-arrow">›</div>

    </button>


    <button class="card card-blue"
            onclick="openPage('billetterie')">

      <div class="card-icon">🎟</div>

      <div class="card-text">

        <span>Cinéma · Parcs<br>Spectacles</span>
      </div>

      <div class="card-arrow">›</div>

    </button>


    <button class="card card-green"

      <div class="card-icon">🚌</div>

      <div class="card-text">
        <strong>SORTIES &<br>VOYAGES</strong>
        <span>Voyages · Ski<br>Journées</span>
      </div>

      <div class="card-arrow">›</div>

    </button>


    <button class="card card-yellow"
            onclick="openPage('offres')">

      <div class="card-icon">🎁</div>

      <div class="card-text">
        <strong>OFFRES CSE</strong>
        <span>Promotions<br>Avantages</span>
      </div>

      <div class="card-arrow">›</div>

    </button>


    <button class="card card-purple"
            onclick="openPage('agenda')">

      <div class="card-icon">▦</div>

      <div class="card-text">

        <span>Toutes les dates<br>importantes</span>
      </div>

      <div class="card-arrow">›</div>

      <div class="card-arrow">›</div>

    <small>Plus</small>
  </button>

</nav>


<script>

const pages = {

  actualites: {
    icon: "📢",
    title: "Actualités",
    text: "Retrouvez ici les affichages, informations du CSE, informations RH et CSSCT."
  },

  billetterie: {
    icon: "🎟️",
    title: "Billetterie",
    text: "Retrouvez les offres cinéma, parcs, spectacles et autres loisirs proposés par votre CSE."
  },

  sorties: {
    icon: "🚌",
    title: "Sorties & Voyages",
    text: "Découvrez les prochains voyages, sorties, journées et séjours proposés par le CSE."
  },

  offres: {
    icon: "🎁",
    title: "Offres CSE",
    text: "Découvrez les promotions et avantages réservés aux salariés."
  },

  agenda: {
    icon: "📅",
    title: "Agenda",
    text: "Toutes les dates importantes du CSE au même endroit."
  },

  inscriptions: {
    icon: "📝",
    title: "Inscriptions",
    text: "Inscrivez-vous aux activités et sorties proposées par le CSE."
  },

  documents: {
    icon: "📄",
    title: "Documents",
    text: "Retrouvez les règlements, informations et comptes rendus du CSE."
  },

  contact: {
    icon: "☎️",
    title: "Contact CSE",
    text: "Une question ? Retrouvez prochainement les coordonnées et moyens de contacter le CSE."
  },

  notifications: {
    icon: "🔔",
    title: "Notifications",
    text: "Vous retrouverez ici les nouvelles notifications du CSE."
  },

  plus: {
    icon: "☰",
    title: "Plus",
    text: "Retrouvez ici les autres services et informations du CSE."
  },

  activites: {
    icon: "⭐",
    title: "Prochaines activités",
    text: "Découvrez les prochaines activités, sorties, voyages et événements du CSE."
  }

};


function openPage(name) {

  const page = pages[name];

  if (!page) return;

  document.getElementById("app").innerHTML = `

    <section class="page">

      <button class="page-back"
              onclick="goHome()">
        ← Accueil
      </button>

      <div style="
        width:65px;
        height:65px;
        margin-top:28px;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#087b3e;
        color:white;
        border-radius:18px;
        font-size:30px;
      ">
        ${page.icon}
      </div>

      <h2>${page.title}</h2>

      <p>${page.text}</p>

      <div style="
        margin-top:25px;
        padding:18px;
        background:#f3f6f4;
        border-radius:16px;
        color:#59635e;
        line-height:1.5;
      ">
        Les contenus seront disponibles prochainement.
      </div>

    </section>

  `;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


function goHome() {
