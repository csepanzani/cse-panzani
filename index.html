<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08743b">
  <title>CSE Panzani</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <div class="brand">
    <img src="logo.png" alt="Logo CSE Panzani">
    <div>
      <h1>CSE PANZANI</h1>
      <p>Votre CSE, partout avec vous.</p>
    </div>
  </div>
</header>

<main>

<section class="welcome">
  <div>
    <small>BIENVENUE</small>
    <h2>Les infos du CSE<br>à portée de main.</h2>
  </div>
  <div class="date" id="date"></div>
</section>

<section class="news">
  <div class="news-icon">📢</div>
  <div>
    <strong>Dernières actualités</strong>
    <p>Retrouvez les nouveaux affichages et informations du CSE.</p>
  </div>
  <button onclick="ouvrir('actualites')">›</button>
</section>

<div class="grid">

<button class="card red" onclick="document.getElementById('content').style.display='block'; document.getElementById('content').innerHTML='<h2>📢 ACTUALITÉS</h2><p>Ça fonctionne !</p>';">
  <b>📰</b>
  <strong>ACTUALITÉS</strong>
  <span>Affichage · CSE · RH · CSSCT</span>
</button>

<button class="card blue" onclick="ouvrir('billetterie')">
  <b>🎟️</b>
  <strong>BILLETTERIE</strong>
  <span>Cinéma · Parcs · Spectacles</span>
</button>

<button class="card green" onclick="ouvrir('sorties')">
  <b>🚌</b>
  <strong>SORTIES & VOYAGES</strong>
  <span>Voyages · Ski · Journées</span>
</button>

<button class="card gold" onclick="ouvrir('offres')">
  <b>🎁</b>
  <strong>OFFRES CSE</strong>
  <span>Promotions · Avantages</span>
</button>

<button class="card purple" onclick="ouvrir('agenda')">
  <b>📅</b>
  <strong>AGENDA</strong>
  <span>Toutes les dates importantes</span>
</button>

<button class="card pink" onclick="ouvrir('inscriptions')">
  <b>📝</b>
  <strong>INSCRIPTIONS</strong>
  <span>Participez aux activités</span>
</button>

<button class="card teal" onclick="ouvrir('documents')">
  <b>📄</b>
  <strong>DOCUMENTS</strong>
  <span>Règlements · Infos · CR</span>
</button>

<button class="card dark" onclick="ouvrir('contact')">
  <b>☎️</b>
  <strong>CONTACT CSE</strong>
  <span>Une question ? Contactez-nous</span>
</button>

</div>

<section class="feature">
  <span>⭐ À LA UNE</span>
  <div>
    <strong>Découvrez les prochaines activités du CSE</strong>
    <small>Sorties · Voyages · Billetterie · Événements</small>
  </div>
  <button onclick="ouvrir('sorties')">›</button>
</section>

<section id="content" class="content" hidden></section>

</main>

<nav class="bottom">

<button onclick="accueil()">⌂<small>Accueil</small></button>

<button onclick="ouvrir('actualites')">▤<small>Actualités</small></button>

<button onclick="ouvrir('agenda')">▣<small>Agenda</small></button>

<button onclick="ouvrir('notifications')">◌<small>Notifications</small><i>3</i></button>

<button onclick="ouvrir('plus')">☰<small>Plus</small></button>

</nav>

<script>

function accueil() {
  document.querySelector(".welcome").hidden = false;
  document.querySelector(".news").hidden = false;
  document.querySelector(".grid").hidden = false;
  document.querySelector(".feature").hidden = false;
  document.getElementById("content").hidden = true;
}

function ouvrir(page) {

  var titres = {
    actualites: "📢 Actualités",
    billetterie: "🎟️ Billetterie",
    sorties: "🚌 Sorties & Voyages",
    offres: "🎁 Offres CSE",
    agenda: "📅 Agenda",
    inscriptions: "📝 Inscriptions",
    documents: "📄 Documents",
    contact: "☎️ Contact CSE",
    notifications: "🔔 Notifications",
    plus: "☰ Plus"
  };

  var textes = {
    actualites: "Retrouvez ici toutes les actualités du CSE Panzani.",
    billetterie: "Cinéma, parcs, spectacles et autres offres.",
    sorties: "Découvrez les prochaines sorties et voyages proposés par le CSE.",
    offres: "Retrouvez toutes les promotions et avantages CSE.",
    agenda: "Toutes les dates importantes du CSE.",
    inscriptions: "Inscrivez-vous aux prochaines activités.",
    documents: "Retrouvez les règlements, informations et comptes rendus.",
    contact: "Une question ? Retrouvez ici les coordonnées du CSE.",
    notifications: "Vous avez 3 nouvelles notifications.",
    plus: "D'autres fonctionnalités du CSE seront disponibles ici."
  };

  document.querySelector(".welcome").hidden = true;
  document.querySelector(".news").hidden = true;
  document.querySelector(".grid").hidden = true;
  document.querySelector(".feature").hidden = true;

  var contenu = document.getElementById("content");

  contenu.hidden = false;

  contenu.innerHTML =
    "<button onclick=\"accueil()\">← Accueil</button>" +
    "<h2>" + titres[page] + "</h2>" +
    "<p>" + textes[page] + "</p>";
  contenu.scrollIntoView({behavior:"smooth"});
}

document.getElementById("date").textContent =
  new Date().toLocaleDateString("fr-FR", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  });

</script>

</body>
</html>
